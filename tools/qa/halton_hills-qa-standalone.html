    "raw_text": "6 Storey residential development with 52 units\nFile type: OPA, ZBA\nUse: Residential\nStatus: Under Review\nNext step: Recommendation Report\nArea: Georgetown\n\nIn December 2020, AGK Multi-Res GP Ltd. submitted Official Plan Amendment and Zoning By-law Amendment applications (File Nos. D09OPA20.005 and D14ZBA20.014) for 16 and 18 Mill Street in Georgetown. The applications were to permit the development of a 6-storey, 52-unit residential apartment building. In May 2022, the applications were revised to respond to concerns raised by the public regarding building height, density, traffic, parking, etc. The revised proposal includes two 4-storey residential buildings containing a total of 34 units for the entire site. This page has been created to provide periodic project updates to members of the public. Please consult this webpage regularly for updates.\n\nApplication Description The proposed Official Plan Amendment would redesignate the site from Medium Density Residential Area and Greenlands to Medium Density Residential Area with a special policy to increase the maximum permitted density. The Zoning By-law Amendment would change the zoning of the site from Low Density Residential One (LDR1-2) and Environmental Protection One (EP1) to Medium Density Residential Two (MDR2) with special provisions.\n\nProject Status Applications filed in December 2020 Statutory Public Meeting held on March 22, 2021 at 6 p.m. ( view the Public Meeting Presentation ). A staff presentation was provided by John McMulkin, Senior Planner – Development Review, followed by comments from the applicant's Planning consultant and interested members of the public Applications revised in May 2022 to respond to concerns raised by the public 3rd submission provided in October 2024 for review 4th submission provided in November 2024 for review\n\nRevised May 2022: two 4-storey residential buildings, 34 units total (originally a single 6-storey, 52-unit apartment building).",

    "raw_text": "Construction of a new 6-storey, 157-unit residential building\nFile type: OPA, ZBA\nUse: Residential\nStatus: Under Review\nNext step: Recommendation Report\nArea: Georgetown\n\nIn December 2022, Kindred Works submitted applications for an Official Plan Amendment and Zoning By-law Amendment (File Nos. D09OPA22.004 and D14ZBA22.011) for 14015 Danby Road in Georgetown. The applications seek to obtain the land use permissions to develop a 6-storey, 157-unit rental apartment building on a portion of the Norval United Church property. The Applicant is proposing that 30% of the units would be considered affordable, meaning they would be rented at no more than 80% of the median market value.\n\nApplication Process The purpose of the applications is to establish the necessary land use permissions to allow for a 6-storey, 157-unit rental apartment building on a portion of the Norval United Church property. The Applicant intends to sever the portion of the property intended for the residential building from the church parcel, but both properties would remain under ownership of the Norval United Church. The Official Plan Amendment application proposes to change the designation of the severed property from “Major Institutional Area” to site-specific “High Density Residential Area”. Similarly, the Zoning By-law Amendment application seeks to change the zoning from an “Institutional (I)” Zone (which doesn’t permit residential uses) to a “High Density Residential (HDR)” Zone, which permits apartment buildings.\n\nProject Status Applications filed on December 16, 2022. Staff comments provided to Applicant on March 9, 2023. Statutory Public Meeting held on March 27, 2023, at 6 p.m. A staff presentation was provided by Jeff Markowiak, Director of Development Review, followed by a presentation from the Applicant's planning consultant. View the Public Meeting Report Public Open House held by the Applicant on April 18, 2023, at the Norval United Church to provide the pu     "raw_text": "apartment buildings with 6 residential towers\nFile type: OPA, ZBA\nUse: Residential\nStatus: Under Review\nNext step: Contact Planning Department\nArea: Georgetown\n\nGilbach Georgetown Inc., through its consultant (MHBC Planning), has submitted Official Plan Amendment, Zoning By-law Amendment and Draft Plan of Subdivision applications (File Nos. D09OPA24.002, D14ZBA24.009 and D12SUB24.002) for 130 Mountainview Road North in Georgetown. The applications are to allow for the development of 3 apartment buildings containing 6 towers. UPDATE: In September 2025 Gilbach Georgetown Inc. through its solicitor (WeirFoulds LLP) filed an appeal of the submitted Official Plan Amendment, Zoning By-law Amendment and Draft Plan of Subdivision applications to the Ontario Land Tribunal (OLT) pursuant to subsections 22(7), 34(11) and 51(34) of the Planning Act for lack of decision within 120 days of the applications being deemed complete by the Town. The OLT has set a Case Management Conference (CMC) for the appeal for Thursday, January 15, 2025 , which will be held virtually. The purpose of the CMC is to identify and discuss the key information relevant to the appeal, including but not limited to: - Identifying parties and participants to the hearing; - Identifying issues that may be raised at the hearing; - Discussion on the Draft Procedural Order (i.e., how the hearing will be organized); - Discuss possibilities for settlement and for mediation discussions; and, - Discussion on a start date and duration of the hearing. Anyone wishing to participate in the OLT proceedings as a party or participant is required to complete a request form and submit it to the assigned Tribunal Case Coordinator (Leeann Situ – [email protected] ) 10 days in advance of the CMC. The OLT Member presiding over the CMC will review and consider any party or participant request at the CMC. Attendance at the January 15th CMC is required for anyone seeking party or participant status. Links to the request forms are found below: OLT | Party Status Request Form OLT | Participant Status Request Further information regarding the OLT appeal and hearing process can be found under the OLT | Rules of Practice and Procedure . (Note: the roles of a party or participant can be found under Section 1.2 – Definitions).\n\nApplication Process The applications seek permission to construct a development that consists of: 3 apartment buildings containing 6 towers (ranging in height from 17 to 22 storeys) with 1,481 total dwelling units; A new public road to connect River Drive with Mountainview Road; Commercial uses on the ground floor of the building located closest to the intersection of River Drive and Mountainview Road North; A privately-owned, publicly accessible park; and, 1,481 total parking spaces (1,333 for tenant and 148 for visitors and retail parking contained underground and within the proposed buildings)\n\nProject Status Applications filed in late December 2024 and public notification completed in January 2025 (view the Notice of Received Applications ). 1st submission materials circulated to Town and external agency staff for review in January 2025 (see corresponding heading below for 1st submission materials) In September 2025, the applicant filed an appeal of the submitted applications to the Ontario Land Tribunal (OLT) for lack of decision within 120 days of the applications being deemed complete by the Town. The Town is currently awaiting formal direction from the OLT regarding next steps.",

    "raw_text": "81 Townhouses & 1 Single Detached\nFile type: OPA, ZBA\nUse: Residential\nStatus: Under Review\nArea: Glen Williams\n\nIn December 2024, Eden Oak (Bayfield) Inc. through its consultant (Weston Consulting) submitted Official Plan Amendment, Zoning By-law Amendment and Draft Plan of Subdivision applications (File Nos. D09OPA24.001, D14ZBA24.008 and D12SUB24.001) for 159 Confederation Street in Glen Williams. The applications are to allow for the development of 81 townhouse dwelling units and 1 single detached dwelling on a new private road. UPDATE: In May 2025, Eden Oak (Bayfield) Inc. through its solicitor (Parente Borean LLP) filed an appeal of the submitted Official Plan Amendment, Zoning By-law Amendment and Draft Plan of Subdivision applications to the Ontario Land Tribunal (OLT) pursuant to subsections 22(7), 34(11) and 51(34) of the Planning Act for lack of decision within 120 days of the applications being deemed complete by the Town. The OLT has scheduled a Case Management Conference (CMC) for the appeal to occur at 10 a.m. on Friday, October 24, 2025, which will be held virtually. View the Notice of Case Management Conference .\n\nApplication Process The development proposal is for 82 total dwelling units at 159 Confederation Street (Glen Williams) consisting of: 81 two-storey townhouse dwelling units (within 15 townhouse blocks); and, 1 single detached dwelling. The development is proposed for a new private condominium road. Each unit would contain 4 parking spaces (2 in the garage, 2 in the driveway). The development includes 26 visitor parking spaces and 2 neighbourhood parks (parkettes):\n\nProject Status Applications filed and public notification completed in December 2024 (view the Notice of Received Applications ) 1st submission materials circulated to Town and external agency staff for review in January 2025 Statutory Public Meeting held on March 24, 2025 at 6 p.m. (view the Public Meeting Presentation ). A staff presentation was pro     "raw_text": "774 residential units with a mixed use/commercial block\nFile type: ZBA, Subdivision\nUse: Residential\nStatus: Under Review\nNext step: Contact Planning Department\nArea: Georgetown\n\nIn April 2025, Russell Pines Property Corp. through its consultant (Glen Schnarr & Associates Inc.) submitted Zoning By-law Amendment and Draft Plan of Subdivision applications (File Nos. D14ZBA25.003 and D12SUB25.001) for 16469 10 Side Road in Georgetown. The applications are to allow for the development of 744 residential dwelling units and a mixed-use/commercial block. UPDATE: In November 2025 Russell Pines Property Corp. through its solicitor (Kagan Shastri DeMelo Winer Park Lawyers LLP) filed an appeal of the submitted Zoning By-law Amendment and Draft Plan of Subdivision applications to the Ontario Land Tribunal (OLT) pursuant to subsections 34(11) and 51(34) of the Planning Act for lack of decision within 120 days of the applications being deemed complete by the Town. The Town is awaiting further instructions from the OLT regarding next steps. Questions regarding the status of these applications can be directed to Josh Salisbury, Senior Policy Planner, at 905-873-2600, ext. 2165 or via email .\n\nApplication Process The development proposal is for 744 total dwelling units and a mixed-use/commercial block at 16469 10 Side Road (Georgetown) consisting of: 274 single detached dwelling lots, as follows: 198 traditional single detached lots; 76 detached dual-frontage lots, 470 townhouse dwelling units, as follows: 190 back-to-back townhouse units (within 15 townhouse blocks); 169 street townhouse units (within 31 townhouse blocks); 111 dual frontage townhouse units (within 20 townhouse blocks), 1 Commercial/Mixed Use block (no built form for this block has been currently identified but the Southeast Georgetown Secondary Plan permits live/work uses, stacked townhouses and apartment dwellings with the requirement that a minimum of 1,800 m 2 of commercial floor area be developed within the block first); 2 neighbourhood parks and 1 parkette; and, a stormwater management pond. There are also approximately 5.10 hectares of the property located outside of the urban boundary that are to be conveyed to the Town to accommodate a new recreational trail and for the preservation of present natural heritage features.\n\nProject Status Applications filed and public notification completed in April 2025 (view the Notice of Received Applications ) 1st submission materials circulated to Town and external agency staff for review in April 2025 (see corresponding heading below for 1st submission materials) Statutory Public Meeting to be held on June 16, 2025 at 6 p.m. (view the Notice of Public Meeting ). A staff presentation will be provided by Josh Salisbury, Senior Policy Planner, followed by a presentation from the applicant’s planning consultant and any questions and comments by interested members of the public",

<script type="text/plain" id="viewer-src">/*
 * Dev Permit QA viewer - browser dashboard for eyeballing harvester output.
 *
 * Dynamic input: instead of a hard-coded data blob, this loads a JSON file at
 * runtime - either the default sample (data/processed/north_van.json, fetched
 * on start) or any file you pick with the "Load JSON" button. Point it at any
 * data/processed/<municipality>.json the harvester writes.
 *
 * How to run (needs a local static server so the browser can fetch the .jsx and the
 * JSON - file:// is blocked by the browser):
 *     make qa           # serves the repo root at http://localhost:8000
 * then open http://localhost:8000/tools/qa/
 *
 * No build step and no npm: index.html pulls React + Babel from a CDN and compiles
 * this file in the browser. React/ReactDOM are globals (not ES imports) for that reason.
 */

const { useState, useMemo, useEffect } = React;

// ---------------------------------------------------------------------------
// Adapter: map a harvester row (schema.sql field names) to the short keys this
// dashboard renders. Kept tolerant with ?? fallbacks so a file that already uses
// the short keys (e.g. an older export) still renders.
// ---------------------------------------------------------------------------
function normalize(rec) {
  const ms = rec.milestones ?? rec.ms ?? [];
  const docs = rec.documents ?? rec.docs ?? [];
  return {
    address: rec.address ?? null,
    permit_id: rec.permit_id ?? null,
    permit_type: rec.permit_type ?? null,
    dev_class: rec.development_class ?? rec.dev_class ?? null,
    status: rec.status ?? null,
    stories: rec.number_of_stories ?? rec.stories ?? null,
    units: rec.units_total ?? rec.units ?? null,
    unit_mix: rec.unit_mix ?? null,
    rental: rec.rental_or_strata ?? rec.rental ?? null,
    rental_sub: rec.rental_subtype ?? rec.rental_sub ?? null,
    rental_mix: rec.rental_mix ?? null,
    parking_v: rec.parking_vehicle_stalls ?? rec.parking_v ?? null,
    parking_b: rec.parking_bike_stalls ?? rec.parking_b ?? null,
    parking_notes: rec.parking_notes ?? null,
    floor_area: rec.floor_area ?? null,
    floor_area_unit: rec.floor_area_unit ?? "m2",
    footprint: rec.footprint_area ?? null,
    lot_area: rec.lot_area ?? null,
    lot_area_unit: rec.lot_area_unit ?? "m2",
    height: rec.height_m ?? null,
    energy: rec.energy_info ?? null,
    materials: rec.building_materials ?? null,
    mechanical: rec.mechanical_system_info ?? null,
    retrofit: rec.retrofit_info ?? null,
    zoning: rec.zoning_density ?? rec.zoning ?? null,
    dev_name: rec.development_name ?? rec.dev_name ?? null,
    parsed: rec.is_parsed ?? rec.parsed ?? false,
    pdf_fb: rec.needs_pdf_extraction ?? rec.pdf_fb ?? false,
    review: rec.needs_review ?? rec.review ?? false,
    conf: rec.extraction_confidence ?? rec.conf ?? 0,
    method: rec.extraction_method ?? rec.method ?? null,
    // Real enrichment status: did a PDF (Ollama) actually contribute, not just "was it flagged".
    enriched: /ollama|claude_read/.test(rec.extraction_method ?? rec.method ?? ""),
    url: rec.source_url ?? rec.url ?? null,
    // The external page (e.g. Engage Port Moody) the rich fields were cross-referenced from.
    enrichmentUrl: rec.enrichment_url ?? null,
    // Sibling applications folded into this record at consolidation (same project).
    related: rec.related_permits ?? [],
    prose: rec.raw_text ?? rec.prose ?? null,
    occ: rec.occupancy_types ?? rec.occ ?? [],
    ms: ms.map((m) => ({ m: m.milestone ?? m.m ?? "", d: m.milestone_date ?? m.d ?? null })),
    docs: docs.map((d) => ({ t: d.title ?? d.t ?? null, r: d.doc_role ?? d.r ?? null, u: d.url ?? d.u ?? null })),
    // Per-field provenance ({field: method}) and any HTML-vs-PDF disagreements.
    methods: rec.field_methods ?? {},
    conflicts: rec.conflicts ?? [],
  };
}

// How each extraction method is shown and whether it is trusted (deterministic) or a model
// guess (non-deterministic). Deterministic reads green, model reads amber/orange.
const METHOD_STYLE = {
  html:             { label: "html",       bg: "#dcfce7", fg: "#166534", det: true },
  pdf_text_regex:   { label: "pdf·regex",  bg: "#dcfce7", fg: "#166534", det: true },
  pdf_geometry:     { label: "pdf·geom",   bg: "#dcfce7", fg: "#166534", det: true },
  pdf_model_text:   { label: "pdf·model",  bg: "#fef3c7", fg: "#92400e", det: false },
  pdf_model_vision: { label: "pdf·vision", bg: "#fed7aa", fg: "#9a3412", det: false },
  pdf_claude:       { label: "pdf·claude", bg: "#e0e7ff", fg: "#3730a3", det: false },
};

const isNonDeterministic = (r) =>
  Object.values(r.methods || {}).some((m) => METHOD_STYLE[m] && !METHOD_STYLE[m].det);

const CONF_COLORS = {
  0: "#ef4444", 0.2: "#f97316", 0.4: "#eab308",
  0.6: "#84cc16", 0.8: "#22c55e", 1: "#16a34a"
};

const confColor = (c) => CONF_COLORS[c] || "#6b7280";

const Badge = ({ children, bg = "#e5e7eb", fg = "#374151" }) => (
  <span style={{ background: bg, color: fg, padding: "2px 8px", borderRadius: 9999,
    fontSize: 11, fontWeight: 600, whiteSpace: "nowrap", display: "inline-block", margin: "1px 2px" }}>
    {children}
  </span>
);

const MethodTag = ({ method }) => {
  const s = METHOD_STYLE[method];
  if (!s) return null;
  return (
    <span title={method} style={{ background: s.bg, color: s.fg, padding: "0 6px", borderRadius: 9999,
      fontSize: 10, fontWeight: 700, whiteSpace: "nowrap", flexShrink: 0 }}>
      {s.label}
    </span>
  );
};

const Field = ({ label, value, method }) => {
  if (value == null || value === "" || (Array.isArray(value) && !value.length)) return null;
  const display = typeof value === "object" && !Array.isArray(value)
    ? Object.entries(value).map(([k, v]) => `${k}: ${v}`).join(", ")
    : Array.isArray(value) ? value.join(", ") : String(value);
  return (
    <div style={{ display: "flex", gap: 6, padding: "3px 0", borderBottom: "1px solid #f3f4f6", fontSize: 13, alignItems: "center" }}>
      <span style={{ color: "#6b7280", minWidth: 120, flexShrink: 0, fontWeight: 500 }}>{label}</span>
      <span style={{ color: "#111827", flex: 1 }}>{display}</span>
      <MethodTag method={method} />
    </div>
  );
};

const Row = ({ r, idx, expanded, toggle }) => {
  const conf = r.conf ?? 0;
  return (
    <div style={{ borderBottom: "1px solid #e5e7eb" }}>
      <div onClick={toggle} style={{ display: "grid", gridTemplateColumns: "minmax(180px,2fr) 1fr 90px 50px 50px 60px 42px",
        alignItems: "center", padding: "8px 12px", cursor: "pointer", gap: 8,
        background: expanded ? "#f8fafc" : idx % 2 === 0 ? "#fff" : "#fafafa",
        transition: "background .15s" }}
        onMouseEnter={e => e.currentTarget.style.background = "#f0f9ff"}
        onMouseLeave={e => e.currentTarget.style.background = expanded ? "#f8fafc" : idx % 2 === 0 ? "#fff" : "#fafafa"}>
        <div style={{ fontWeight: 500, fontSize: 13, color: "#111827", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {r.address}
        </div>
        <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
          {r.permit_type && <Badge bg="#dbeafe" fg="#1e40af">{r.permit_type}</Badge>}
          {r.dev_class && r.dev_class !== "unknown" && <Badge bg={
            r.dev_class === "residential" ? "#dcfce7" :
            r.dev_class === "commercial" ? "#fef3c7" :
            r.dev_class === "mixed" ? "#ede9fe" :
            r.dev_class === "industrial" ? "#ffedd5" : "#e0e7ff"
          } fg="#374151">{r.dev_class}</Badge>}
        </div>
        <div style={{ fontSize: 12, color: "#6b7280", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.status || "-"}</div>
        <div style={{ fontSize: 12, textAlign: "center" }}>{r.stories ?? "-"}</div>
        <div style={{ fontSize: 12, textAlign: "center" }}>{r.units ?? "-"}</div>
        <div style={{ textAlign: "center" }}>
          <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: confColor(conf), marginRight: 4 }} />
          <span style={{ fontSize: 11, color: "#374151" }}>{conf}</span>
        </div>
        <div style={{ fontSize: 14, textAlign: "center", color: "#9ca3af" }}>{expanded ? "▲" : "▼"}</div>
      </div>

      {expanded && (
        <div style={{ padding: "12px 16px 16px", background: "#f8fafc", display: "grid",
          gridTemplateColumns: "1fr 1fr", gap: "0 32px" }}>
          {r.conflicts.length > 0 && (
            <div style={{ gridColumn: "1/-1", marginBottom: 10, background: "#fff7ed",
              border: "1px solid #fdba74", borderRadius: 6, padding: "8px 12px" }}>
              <div style={{ fontWeight: 700, fontSize: 12, color: "#9a3412", marginBottom: 4 }}>
                ⚠ Text vs PDF conflicts ({r.conflicts.length})
              </div>
              {r.conflicts.map((c, i) => (
                <div key={i} style={{ fontSize: 12, color: "#7c2d12", padding: "1px 0", display: "flex", gap: 4, alignItems: "center", flexWrap: "wrap" }}>
                  <b>{c.field}:</b>
                  <b>{String(c.kept?.value ?? c.claude ?? "-")}</b>
                  <MethodTag method={c.kept?.method || "pdf_claude"} />
                  <span>≠</span>
                  <b>{String(c.pdf?.value ?? c.html ?? "-")}</b>
                  <MethodTag method={c.pdf?.method || "html"} />
                </div>
              ))}
            </div>
          )}
          <div>
            <div style={{ fontWeight: 600, fontSize: 12, color: "#6b7280", marginBottom: 4, textTransform: "uppercase", letterSpacing: ".5px" }}>Parsed Fields</div>
            <Field label="Permit ID" value={r.permit_id} />
            <Field label="Dev Name" value={r.dev_name} />
            <Field label="Type" value={r.permit_type} method={r.methods.permit_type} />
            <Field label="Class" value={r.dev_class} method={r.methods.development_class} />
            <Field label="Occupancy" value={r.occ} method={r.methods.occupancy_types} />
            <Field label="Stories" value={r.stories} method={r.methods.number_of_stories} />
            <Field label="Height (m)" value={r.height} method={r.methods.height_m} />
            <Field label="Units" value={r.units} method={r.methods.units_total} />
            <Field label="Unit Mix" value={r.unit_mix} method={r.methods.unit_mix} />
            <Field label="Rental" value={r.rental} method={r.methods.rental_or_strata} />
            <Field label="Rental Sub" value={r.rental_sub} method={r.methods.rental_subtype} />
            <Field label="Rental Mix" value={r.rental_mix} />
            <Field label="Parking (V)" value={r.parking_v} method={r.methods.parking_vehicle_stalls} />
            <Field label="Parking (B)" value={r.parking_b} method={r.methods.parking_bike_stalls} />
            <Field label="Parking Notes" value={r.parking_notes} method={r.methods.parking_notes} />
            <Field label="Floor Area" value={r.floor_area != null ? `${r.floor_area} ${r.floor_area_unit}` : null} method={r.methods.floor_area} />
            <Field label="Footprint" value={r.footprint != null ? `${r.footprint} ${r.floor_area_unit}` : null} method={r.methods.footprint_area} />
            <Field label="Lot Area" value={r.lot_area != null ? `${r.lot_area} ${r.lot_area_unit}` : null} method={r.methods.lot_area} />
            <Field label="Zoning" value={r.zoning} method={r.methods.zoning_density} />
            <Field label="Energy" value={r.energy} method={r.methods.energy_info} />
            <Field label="Materials" value={r.materials} method={r.methods.building_materials} />
            <Field label="Mechanical" value={r.mechanical} method={r.methods.mechanical_system_info} />
            <Field label="Retrofit" value={r.retrofit} method={r.methods.retrofit_info} />
          </div>
          <div>
            <div style={{ fontWeight: 600, fontSize: 12, color: "#6b7280", marginBottom: 4, textTransform: "uppercase", letterSpacing: ".5px" }}>Extraction</div>
            <Field label="Parsed" value={r.parsed ? "✓" : "✗"} />
            <Field label="PDF Enriched" value={r.enriched ? (/claude_read/.test(r.method || "") ? "Yes - Claude read PDF" : "Yes - via Ollama PDF") : "No"} />
            <Field label="Needs Review" value={r.review ? "⚠ Yes" : "No"} />
            <Field label="Confidence" value={conf} />
            <Field label="Method" value={r.method} />

            {r.prose && <>
              <div style={{ fontWeight: 600, fontSize: 12, color: "#6b7280", margin: "12px 0 4px", textTransform: "uppercase", letterSpacing: ".5px" }}>Source Prose</div>
              <div style={{ fontSize: 12, color: "#374151", background: "#fff", padding: 8, borderRadius: 6, border: "1px solid #e5e7eb", maxHeight: 120, overflow: "auto", lineHeight: 1.5 }}>
                {r.prose}
              </div>
            </>}

            {r.ms.length > 0 && <>
              <div style={{ fontWeight: 600, fontSize: 12, color: "#6b7280", margin: "12px 0 4px", textTransform: "uppercase", letterSpacing: ".5px" }}>Milestones</div>
              {r.ms.map((m, i) => (
                <div key={i} style={{ fontSize: 12, display: "flex", gap: 8, padding: "2px 0" }}>
                  <span style={{ color: "#6b7280", minWidth: 80 }}>{m.d || "pending"}</span>
                  <span>{m.m}</span>
                </div>
              ))}
            </>}

            {r.docs.length > 0 && <>
              <div style={{ fontWeight: 600, fontSize: 12, color: "#6b7280", margin: "12px 0 4px", textTransform: "uppercase", letterSpacing: ".5px" }}>Documents ({r.docs.length})</div>
              {r.docs.map((d, i) => (
                <div key={i} style={{ fontSize: 12, padding: "2px 0" }}>
                  {/* Always a link: the document's own URL, falling back to the source page. */}
                  <a href={d.u || r.url} target="_blank" rel="noopener" style={{ color: "#2563eb", textDecoration: "underline" }}>
                    {d.t || "Untitled"}</a>
                  <Badge>{d.r}</Badge>
                </div>
              ))}
            </>}

            {r.related.length > 0 && <>
              <div style={{ fontWeight: 600, fontSize: 12, color: "#6b7280", margin: "12px 0 4px", textTransform: "uppercase", letterSpacing: ".5px" }}>Related Applications ({r.related.length})</div>
              {r.related.map((p, i) => (
                <div key={i} style={{ fontSize: 12, padding: "2px 0" }}>
                  <strong>{p.permit_id}</strong>
                  {p.permit_type ? <Badge>{p.permit_type}</Badge> : null}
                  {p.address ? <span style={{ color: "#6b7280" }}> {p.address}</span> : null}
                </div>
              ))}
            </>}
          </div>
          <div style={{ gridColumn: "1/-1", marginTop: 8, display: "flex", gap: 16, flexWrap: "wrap" }}>
            <a href={r.url} target="_blank" rel="noopener" style={{ fontSize: 12, color: "#2563eb" }}>
              Open source page →
            </a>
            {r.enrichmentUrl && (
              <a href={r.enrichmentUrl} target="_blank" rel="noopener" style={{ fontSize: 12, color: "#2563eb" }}>
                Open Engage page (enrichment source) →
              </a>
            )}
          </div>
        </div>
      )}
    </div>
  );
};

function QADashboard({ data }) {
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("all");
  const [classFilter, setClassFilter] = useState("all");
  const [typeFilter, setTypeFilter] = useState("all");
  const [methodFilter, setMethodFilter] = useState("all");
  const [sortKey, setSortKey] = useState("conf_asc");
  const [expanded, setExpanded] = useState(new Set());

  const filtered = useMemo(() => {
    let rows = data.map((r, i) => ({ ...r, _i: i }));
    if (search) {
      const q = search.toLowerCase();
      rows = rows.filter(r => (r.address || "").toLowerCase().includes(q) ||
        (r.permit_id || "").toLowerCase().includes(q) ||
        (r.dev_name || "").toLowerCase().includes(q));
    }
    if (filter === "enriched") rows = rows.filter(r => r.enriched);
    else if (filter === "needs_review") rows = rows.filter(r => r.review);
    else if (filter === "ok") rows = rows.filter(r => !r.review && !(r.conflicts || []).length);
    else if (filter === "conflicts") rows = rows.filter(r => (r.conflicts || []).length);
    else if (filter === "nondeterministic") rows = rows.filter(isNonDeterministic);

    if (classFilter !== "all") rows = rows.filter(r => r.dev_class === classFilter);
    if (typeFilter !== "all") rows = rows.filter(r => (r.permit_type || "None") === typeFilter);
    if (methodFilter !== "all") rows = rows.filter(r => (r.method || "None") === methodFilter);

    if (sortKey === "conf_asc") rows.sort((a, b) => (a.conf ?? 0) - (b.conf ?? 0));
    else if (sortKey === "conf_desc") rows.sort((a, b) => (b.conf ?? 0) - (a.conf ?? 0));
    else if (sortKey === "address") rows.sort((a, b) => (a.address || "").localeCompare(b.address || ""));
    else if (sortKey === "units_desc") rows.sort((a, b) => (b.units ?? 0) - (a.units ?? 0));
    return rows;
  }, [data, search, filter, classFilter, typeFilter, methodFilter, sortKey]);

  // Distinct extraction methods present in the data (e.g. html, html+ollama_pdf, arcgis).
  const methods = useMemo(
    () => Array.from(new Set(data.map(r => r.method || "None"))).sort(),
    [data]
  );

  const stats = useMemo(() => ({
    total: data.length,
    parsed: data.filter(r => r.parsed).length,
    enriched: data.filter(r => r.enriched).length,
    review: data.filter(r => r.review).length,
    conflicts: data.filter(r => (r.conflicts || []).length).length,
  }), [data]);

  const toggle = (i) => setExpanded(prev => {
    const next = new Set(prev);
    next.has(i) ? next.delete(i) : next.add(i);
    return next;
  });

  const selStyle = { padding: "6px 10px", borderRadius: 6, border: "1px solid #d1d5db", fontSize: 12, background: "#fff", color: "#374151" };

  return (
    <div>
      {/* header stats */}
      <div style={{ display: "flex", gap: 12, marginBottom: 16, flexWrap: "wrap" }}>
        {[
          { label: "Total", val: stats.total, bg: "#f3f4f6" },
          { label: "Parsed", val: stats.parsed, bg: "#dcfce7" },
          { label: "PDF Enriched", val: stats.enriched, bg: "#dbeafe" },
          { label: "Needs Review", val: stats.review, bg: "#fef3c7" },
          { label: "Conflicts", val: stats.conflicts, bg: "#ffedd5" },
        ].map(s => (
          <div key={s.label} style={{ background: s.bg, borderRadius: 8, padding: "8px 16px", minWidth: 90, textAlign: "center" }}>
            <div style={{ fontSize: 22, fontWeight: 700, color: "#111827" }}>{s.val}</div>
            <div style={{ fontSize: 11, color: "#6b7280" }}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* filters */}
      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
        <input value={search} onChange={e => setSearch(e.target.value)}
          placeholder="Search address, permit ID, name…"
          style={{ ...selStyle, flex: "1 1 200px", minWidth: 160 }} />
        <select value={filter} onChange={e => setFilter(e.target.value)} style={selStyle}>
          <option value="all">All QA states</option>
          <option value="enriched">PDF-enriched only</option>
          <option value="needs_review">Needs review</option>
          <option value="ok">OK (no issues)</option>
          <option value="conflicts">Has text/PDF conflict</option>
          <option value="nondeterministic">Has model-derived field</option>
        </select>
        <select value={classFilter} onChange={e => setClassFilter(e.target.value)} style={selStyle}>
          <option value="all">All classes</option>
          <option value="residential">Residential</option>
          <option value="commercial">Commercial</option>
          <option value="mixed">Mixed</option>
          <option value="industrial">Industrial</option>
          <option value="institutional">Institutional</option>
          <option value="unknown">Unknown</option>
        </select>
        <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)} style={selStyle}>
          <option value="all">All permit types</option>
          <option value="Rezoning">Rezoning</option>
          <option value="Development Permit">Dev Permit</option>
          <option value="Development Variance Permit">DVP</option>
          <option value="OCP Amendment">OCP Amendment</option>
          <option value="Temporary Use Permit">TUP</option>
          <option value="None">No type parsed</option>
        </select>
        <select value={methodFilter} onChange={e => setMethodFilter(e.target.value)} style={selStyle}>
          <option value="all">All methods</option>
          {methods.map(m => <option key={m} value={m}>{m}</option>)}
        </select>
        <select value={sortKey} onChange={e => setSortKey(e.target.value)} style={selStyle}>
          <option value="conf_asc">Confidence ↑ (worst first)</option>
          <option value="conf_desc">Confidence ↓</option>
          <option value="address">Address A–Z</option>
          <option value="units_desc">Units ↓</option>
        </select>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
        <div style={{ fontSize: 12, color: "#6b7280" }}>{filtered.length} of {stats.total} rows shown</div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: "#6b7280" }}>
          <span>Field source:</span>
          <MethodTag method="html" /> <MethodTag method="pdf_text_regex" /> <MethodTag method="pdf_geometry" />
          <span style={{ color: "#9ca3af" }}>deterministic ·</span>
          <MethodTag method="pdf_model_text" /> <MethodTag method="pdf_model_vision" />
          <span style={{ color: "#9ca3af" }}>model (review)</span>
        </div>
      </div>

      {/* table header */}
      <div style={{ display: "grid", gridTemplateColumns: "minmax(180px,2fr) 1fr 90px 50px 50px 60px 42px",
        padding: "6px 12px", background: "#f1f5f9", borderRadius: "8px 8px 0 0", gap: 8,
        fontSize: 11, fontWeight: 600, color: "#64748b", textTransform: "uppercase", letterSpacing: ".3px" }}>
        <div>Address</div><div>Type / Class</div><div>Status</div>
        <div style={{ textAlign: "center" }}>Stry</div>
        <div style={{ textAlign: "center" }}>Units</div>
        <div style={{ textAlign: "center" }}>Conf</div>
        <div />
      </div>

      {/* rows */}
      <div style={{ border: "1px solid #e5e7eb", borderTop: "none", borderRadius: "0 0 8px 8px", overflow: "hidden" }}>
        {filtered.map((r, i) => (
          <Row key={r._i} r={r} idx={i} expanded={expanded.has(r._i)} toggle={() => toggle(r._i)} />
        ))}
        {filtered.length === 0 && (
          <div style={{ padding: 32, textAlign: "center", color: "#9ca3af", fontSize: 14 }}>
            No rows match the current filters.
          </div>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// App shell: owns the dynamic JSON input (default fetch + file picker) and hands
// the normalized rows to the dashboard.
// ---------------------------------------------------------------------------
function App() {
  const DEFAULT = window.QA_DEFAULT_JSON || "/data/processed/north_van.json";
  const [rows, setRows] = useState(null);
  const [source, setSource] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(true);

  const load = (parsed, name) => {
    if (!Array.isArray(parsed)) {
      setError(`${name}: expected a JSON array of permit rows, got ${typeof parsed}.`);
      return;
    }
    setRows(parsed.map(normalize));
    setSource(name);
    setError("");
  };

  useEffect(() => {
    // Self-contained mode: data embedded on the page (window.QA_DATA) so the dashboard runs
    // with no server and no fetch - used by the shareable single-file build (build_standalone.py).
    if (Array.isArray(window.QA_DATA)) {
      load(window.QA_DATA, window.QA_DATA_NAME || "embedded data");
      setLoading(false);
      return;
    }
    let cancelled = false;
    fetch(DEFAULT)
      .then(res => {
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        return res.json();
      })
      .then(json => { if (!cancelled) load(json, DEFAULT.split("/").pop()); })
      .catch(err => {
        if (!cancelled) {
          setError(`Could not auto-load ${DEFAULT} (${err.message}). Pick a file with "Load JSON", or run "make qa" from the repo root and open http://localhost:8000/tools/qa/.`);
        }
      })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, []);

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { load(JSON.parse(reader.result), file.name); }
      catch (err) { setError(`Failed to parse ${file.name}: ${err.message}`); }
    };
    reader.readAsText(file);
  };

  return (
    <div style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", maxWidth: 1100, margin: "0 auto", padding: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 16,
        paddingBottom: 12, borderBottom: "1px solid #e5e7eb" }}>
        <div style={{ fontSize: 18, fontWeight: 700, color: "#111827" }}>Dev Permit QA</div>
        <label style={{ fontSize: 12, fontWeight: 600, color: "#2563eb", cursor: "pointer",
          border: "1px solid #bfdbfe", borderRadius: 6, padding: "6px 12px", background: "#eff6ff" }}>
          Load JSON…
          <input type="file" accept=".json,application/json" onChange={onFile} style={{ display: "none" }} />
        </label>
        <span style={{ fontSize: 12, color: "#6b7280" }}>
          {source ? `Source: ${source}` : loading ? "Loading…" : "No data loaded"}
        </span>
      </div>

      {error && (
        <div style={{ background: "#fef2f2", border: "1px solid #fecaca", color: "#991b1b",
          borderRadius: 8, padding: "10px 14px", fontSize: 13, marginBottom: 16, lineHeight: 1.5 }}>
          {error}
        </div>
      )}

      {rows ? <QADashboard data={rows} />
        : loading ? <div style={{ padding: 32, textAlign: "center", color: "#9ca3af" }}>Loading…</div>
        : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
