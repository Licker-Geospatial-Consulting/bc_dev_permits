[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bc_dev_permits"
version = "0.0.1"
description = "BC municipality development permit scraping and databasing"
authors = [
  { name = "LGeo" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["bc_dev_permits"]
include = ["pyproject.toml", "bc_dev_permits/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["bc_dev_permits"]
force-sort-within-sections = true

